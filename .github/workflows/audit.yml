name: Site audit

on:
  schedule:
    - cron: '17 * * * *' # every hour, 24/7
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['audit/**', 'docs/index.html', '.github/workflows/audit.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run audit
        env:
          SITE_URL: https://careficient.com/
          BRAND: Careficient
          MAX_PAGES: '40'
        run: node audit/run.mjs

      - name: Commit results
        run: |
          git config user.name "site-audit-bot"
          git config user.email "site-audit-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "audit: $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
